<div class="cf-image">
  {% if include.title %}<h3>{{ include.title }}</h3>{% endif %}
  <img
    src="https://imagedelivery.net/{{ site.cloudflare_images_account_hash }}/{{ include.id }}/public"
    alt="{{ include.title | escape }}"
    loading="lazy"
    style="width:100%;height:auto"
  />
  {% if include.comment %}
    <div class="media-comment">{{ include.comment | markdownify }}</div>
  {% endif %}
</div>
